<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Happy Birthday — Suyo Poka</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="confetti"></canvas>

  <!-- Music Toggle Button -->
  <button class="music-btn" id="musicBtn" aria-label="Toggle Music" title="Toggle Music">
    <span id="musicIcon">🎵</span>
  </button>
  <audio id="song" src="hbd.mp3" loop preload="auto"></audio>

  <!-- Birthday Card (hidden initially, revealed after Love is clicked) -->
  <div class="card" id="card" style="display:none;">
    <div class="photo-slider">
      <img src="s0.jpeg" class="active" alt="Birthday photo">
      <img src="s1.jpeg" alt="Birthday photo">
      <img src="s2.jpeg" alt="Birthday photo">
      <img src="s3.jpeg" alt="Birthday photo">
      <img src="s4.jpeg" alt="Birthday photo">
      <img src="s5.jpeg" alt="Birthday photo">
    </div>

    <!-- Revealed card content -->
    <div id="stage1">
      <h1>Happy Birthday, <span class="name">Someone Special ✨</span> 🦋 💖</h1>
      <div class="subtitle">A little surprise from someone who truly cares…</div>
      <div class="message" id="message"></div>
    </div>
  </div>

  <!-- Love Popup Overlay (shown immediately) -->
  <div id="lovePopup" class="love-popup-overlay">
    <div class="love-popup-box">
      <div class="love-popup-emoji">🎂</div>
      <h2 class="love-popup-title" id="popupTitle">Do you love me? 💖</h2>
      <p class="love-popup-sub" id="popupSub">Choose honestly…</p>
      <div class="love-popup-btns">
        <button id="loveYesBtn" class="love-btn-yes">Love ❤️</button>
        <button id="loveNoBtn" class="love-btn-no">Hate 💔</button>
      </div>
    </div>
  </div>


  <!-- Reply Popup Overlay -->
  <div id="replyPopup" class="love-popup-overlay" style="display:none;">
    <div class="love-popup-box">
      <div class="love-popup-emoji">💌</div>
      <h2 class="love-popup-title">Send a Reply?</h2>
      <p class="love-popup-sub">Would you like to send a message back to the sender?</p>
      
      <textarea id="replyMessage" placeholder="Type your message here..." class="reply-textarea" rows="3"></textarea>

      <div class="love-popup-btns" style="min-height: auto; margin-top: 16px;">
        <button id="replySendBtn" class="love-btn-yes" style="padding: 12px 24px; font-size: 14px;">Send Message</button>
        <button id="replySkipBtn" class="love-btn-no">Skip</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>

  <script src="/demos/shared-action-bar.js"></script>
</body>
</html>
