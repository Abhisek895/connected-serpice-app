<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Happy Birthday — Suyo Poka</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="confetti"></canvas>

  <!-- Music Toggle Button -->
  <button class="music-btn" id="musicBtn" aria-label="Toggle Music" title="Toggle Music">
    <span id="musicIcon">🎵</span>
  </button>
  <audio id="song" src="hbd.mp3" loop preload="auto"></audio>

  <!-- Birthday Card -->
  <div class="card" id="card">
    <div class="photo-slider">
      <img src="s0.jpeg" class="active" alt="Birthday photo">
      <img src="s1.jpeg" alt="Birthday photo">
      <img src="s2.jpeg" alt="Birthday photo">
      <img src="s3.jpeg" alt="Birthday photo">
      <img src="s4.jpeg" alt="Birthday photo">
      <img src="s5.jpeg" alt="Birthday photo">
    </div>

    <h1>Happy Birthday, <span class="name">Someone Special ✨</span> 🦋 💖</h1>
    <div class="subtitle">A little surprise from someone who truly cares…</div>
    
    <div class="message" id="message"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
