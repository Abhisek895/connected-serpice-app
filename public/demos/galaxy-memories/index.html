<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Cosmic Galaxy Memories 🌌💖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@500;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #02000b;
            color: #f3e8ff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #webgl-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .top-header {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            width: 90%;
            max-width: 600px;
        }
        .header-title {
            font-family: 'Pacifico', cursive;
            font-size: 1.9rem;
            color: #ff7597;
            text-shadow: 0 0 15px rgba(255, 117, 151, 0.8), 0 0 30px rgba(236, 72, 153, 0.6);
            letter-spacing: 1px;
        }
        .header-sub {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #e9d5ff;
            opacity: 0.85;
            margin-top: 4px;
        }

        .hud-overlay {
            position: fixed;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 90%;
            max-width: 400px;
        }

        .btn-bigbang {
            padding: 16px 36px;
            background: linear-gradient(135deg, #ec4899, #a855f7, #6366f1);
            background-size: 200% 200%;
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(236, 72, 153, 0.7), inset 0 0 15px rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            animation: gradientShift 3s ease infinite, pulseGlow 2s infinite;
        }
        .btn-bigbang:hover {
            transform: scale(1.06);
            box-shadow: 0 0 60px rgba(236, 72, 153, 0.9);
        }
        .btn-bigbang:active {
            transform: scale(0.95);
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 35px rgba(236, 72, 153, 0.7); }
            50% { box-shadow: 0 0 55px rgba(168, 85, 247, 0.9); }
        }

        .controls-row {
            display: flex;
            gap: 10px;
        }
        .hud-btn {
            padding: 10px 20px;
            background: rgba(15, 7, 32, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: #e9d5ff;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .hud-btn:hover {
            background: rgba(168, 85, 247, 0.3);
            border-color: #ec4899;
        }

        .drag-hint {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(15, 7, 32, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #c084fc;
            pointer-events: none;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .drag-hint.visible {
            opacity: 1;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(2, 0, 11, 0.88);
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            width: 100%;
            max-width: 480px;
            background: linear-gradient(135deg, rgba(25, 10, 50, 0.95), rgba(10, 3, 25, 0.98));
            border: 1px solid rgba(236, 72, 153, 0.4);
            border-radius: 28px;
            padding: 28px;
            box-shadow: 0 0 60px rgba(236, 72, 153, 0.4);
            position: relative;
        }
        .modal-close-x {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #e9d5ff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
        }
        .modal-tag {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ec4899;
            margin-bottom: 8px;
        }
        .modal-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #f3e8ff;
            margin-bottom: 16px;
        }
        .letter-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 18px;
            padding: 20px;
            max-height: 240px;
            overflow-y: auto;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.15rem;
            line-height: 1.6;
            color: #e9d5ff;
            white-space: pre-wrap;
            margin-bottom: 24px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <div class="top-header">
        <h1 class="header-title" id="headerTitle">For Jamie From Alex 💖</h1>
        <p class="header-sub" id="headerSub">Our 3D Galaxy of Memories</p>
    </div>

    <div class="drag-hint" id="dragHint">✨ Drag / Swipe to rotate 3D Galaxy ✨</div>

    <div class="hud-overlay">
        <button class="btn-bigbang" id="bigbangBtn">
            <span>✨ Tap to Trigger Big Bang 🌌</span>
        </button>

        <div class="controls-row hidden" id="postBlastControls">
            <button class="hud-btn" id="openLetterBtn">💌 Love Letter</button>
            <button class="hud-btn" id="musicBtn">🎵 Music</button>
        </div>
    </div>

    <!-- Typewriter Love Letter Modal -->
    <div class="modal-overlay" id="letterModal">
        <div class="modal-card">
            <button class="modal-close-x" id="closeModalBtn">✕</button>
            <div class="modal-tag">COSMIC LOVE LETTER 🌟</div>
            <h3 class="modal-title">Written In The Stars 💌</h3>

            <div class="letter-box" id="typewriterBox"></div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <button class="hud-btn" id="closeLetterActionBtn">Close Letter & Next ✨</button>
                <button class="btn-bigbang" id="sendLoveBtn" style="padding: 12px 24px; font-size: 0.8rem;">
                    <span>💫 Send Love Back</span>
                </button>
            </div>
        </div>
    </div>

    <div id="ourstory-badge">💖 Made with OurStory</div>
    <style>
      #ourstory-badge {
        position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
        background: rgba(15, 7, 32, 0.7); backdrop-filter: blur(14px);
        color: white; font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 13px; font-weight: 700; padding: 8px 18px; border-radius: 999px;
        cursor: pointer; border: 1px solid rgba(168, 85, 247, 0.4);
        box-shadow: 0 4px 24px rgba(0,0,0,0.5); z-index: 9999;
        transition: all 0.3s ease; white-space: nowrap;
      }
      #ourstory-badge:hover { background: rgba(236,72,153,0.85); transform: translateX(-50%) scale(1.04); }
    </style>
    <script>
      (function() {
        var badge = document.getElementById('ourstory-badge');
        if (badge) {
          badge.addEventListener('click', function() {
            window.open('https://ourstory.love/?ref=watermark&utm_source=demo_galaxy&utm_medium=badge&utm_campaign=viral', '_blank', 'noopener');
          });
        }
      })();
    </script>

    <script>
        window.GALAXY_DATA = window.GALAXY_DATA || {
            recipientName: "Jamie",
            senderName: "Alex",
            title: "For Jamie From Alex 💖",
            loveMessage: "Every single star in this 3D universe represents a moment I spent loving you.\n\nYou brought magic, warmth, and light into my life. I love you to infinity and beyond! ✨💜",
            photos: [
                "/demos/birthday-wish/s0.jpeg",
                "/demos/surprise/images.jpeg",
                "/demos/date-planner/victoria_memorial_1785673658927.png"
            ],
            audioUrl: "/demos/surprise/loveSong.mp3"
        };

        if (window.GALAXY_DATA.title) {
            document.getElementById('headerTitle').textContent = window.GALAXY_DATA.title;
        }

        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x02000b, 0.0015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 30, 110);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const starsGeo = new THREE.BufferGeometry();
        const starCount = 3000;
        const starPositions = new Float32Array(starCount * 3);
        const starColors = new Float32Array(starCount * 3);

        const palette = [
            new THREE.Color(0xff7597),
            new THREE.Color(0xa855f7),
            new THREE.Color(0x38bdf8),
            new THREE.Color(0xffffff)
        ];

        for (let i = 0; i < starCount; i++) {
            starPositions[i * 3] = (Math.random() - 0.5) * 600;
            starPositions[i * 3 + 1] = (Math.random() - 0.5) * 600;
            starPositions[i * 3 + 2] = (Math.random() - 0.5) * 600;

            const col = palette[Math.floor(Math.random() * palette.length)];
            starColors[i * 3] = col.r;
            starColors[i * 3 + 1] = col.g;
            starColors[i * 3 + 2] = col.b;
        }

        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starsGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

        const starMat = new THREE.PointsMaterial({
            size: 1.5,
            vertexColors: true,
            transparent: true,
            opacity: 0.8
        });
        const starPoints = new THREE.Points(starsGeo, starMat);
        scene.add(starPoints);

        const heartPointsCount = 2400;
        const heartGeo = new THREE.BufferGeometry();
        const heartPositions = new Float32Array(heartPointsCount * 3);
        const heartVelocities = new Float32Array(heartPointsCount * 3);

        for (let i = 0; i < heartPointsCount; i++) {
            const t = Math.random() * Math.PI * 2;
            const u = (Math.random() - 0.5) * Math.PI;

            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            const z = u * 12;

            const scale = 1.2;
            heartPositions[i * 3] = x * scale;
            heartPositions[i * 3 + 1] = y * scale;
            heartPositions[i * 3 + 2] = z * scale;

            heartVelocities[i * 3] = (Math.random() - 0.5) * 6;
            heartVelocities[i * 3 + 1] = (Math.random() - 0.5) * 6;
            heartVelocities[i * 3 + 2] = (Math.random() - 0.5) * 6;
        }

        heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPositions, 3));
        const heartMat = new THREE.PointsMaterial({
            size: 2.2,
            color: 0xff4d6d,
            transparent: true,
            opacity: 0.95,
            blending: THREE.AdditiveBlending
        });
        const heartOrb = new THREE.Points(heartGeo, heartMat);
        scene.add(heartOrb);

        const galaxyCount = 5500;
        const galaxyGeo = new THREE.BufferGeometry();
        const galaxyPos = new Float32Array(galaxyCount * 3);
        const galaxyColors = new Float32Array(galaxyCount * 3);

        for (let i = 0; i < galaxyCount; i++) {
            const radius = Math.random() * 95 + 15;
            const spinAngle = radius * 0.15;
            const branchAngle = ((i % 3) * (2 * Math.PI)) / 3;

            const randomX = (Math.random() - 0.5) * 8;
            const randomY = (Math.random() - 0.5) * 6;
            const randomZ = (Math.random() - 0.5) * 8;

            galaxyPos[i * 3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
            galaxyPos[i * 3 + 1] = randomY;
            galaxyPos[i * 3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

            const mixColor = new THREE.Color(0xff4d6d).lerp(new THREE.Color(0x9333ea), radius / 110);
            galaxyColors[i * 3] = mixColor.r;
            galaxyColors[i * 3 + 1] = mixColor.g;
            galaxyColors[i * 3 + 2] = mixColor.b;
        }

        galaxyGeo.setAttribute('position', new THREE.BufferAttribute(galaxyPos, 3));
        galaxyGeo.setAttribute('color', new THREE.BufferAttribute(galaxyColors, 3));

        const galaxyMat = new THREE.PointsMaterial({
            size: 1.8,
            vertexColors: true,
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending
        });
        const galaxyDisk = new THREE.Points(galaxyGeo, galaxyMat);
        scene.add(galaxyDisk);

        const photoGroup = new THREE.Group();
        scene.add(photoGroup);

        const textureLoader = new THREE.TextureLoader();
        const photos = window.GALAXY_DATA.photos;
        const photoMeshes = [];

        photos.forEach((url, i) => {
          const tex = textureLoader.load(url);
          const geo = new THREE.PlaneGeometry(16, 20);
          const mat = new THREE.MeshBasicMaterial({
            map: tex,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0
          });
          const mesh = new THREE.Mesh(geo, mat);

          const angle = (i / photos.length) * Math.PI * 2;
          const radius = 55;
          mesh.position.set(Math.cos(angle) * radius, 12, Math.sin(angle) * radius);
          mesh.lookAt(0, 12, 0);

          photoGroup.add(mesh);
          photoMeshes.push(mesh);
        });

        let state = 'IDLE';
        let animProgress = 0;

        function triggerBigBang() {
            if (state !== 'IDLE') return;
            state = 'IMPLODING';

            document.getElementById('bigbangBtn').classList.add('hidden');
            document.getElementById('dragHint').classList.add('visible');

            playMusic();
        }

        document.getElementById('bigbangBtn').addEventListener('click', triggerBigBang);

        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaMove = { x: e.clientX - previousMousePosition.x, y: e.clientY - previousMousePosition.y };

            scene.rotation.y += deltaMove.x * 0.008;
            scene.rotation.x += deltaMove.y * 0.005;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('touchstart', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const deltaMove = { x: e.touches[0].clientX - previousMousePosition.x, y: e.touches[0].clientY - previousMousePosition.y };

            scene.rotation.y += deltaMove.x * 0.008;
            scene.rotation.x += deltaMove.y * 0.005;

            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });
        window.addEventListener('touchend', () => { isDragging = false; });

        function animate() {
            requestAnimationFrame(animate);

            const pos = heartGeo.attributes.position.array;

            if (state === 'IDLE') {
                heartOrb.rotation.y += 0.008;
                const time = Date.now() * 0.003;
                const scale = 1 + Math.sin(time) * 0.08;
                heartOrb.scale.set(scale, scale, scale);

            } else if (state === 'IMPLODING') {
                animProgress += 0.05;
                const scale = Math.max(0.01, 1 - animProgress);
                heartOrb.scale.set(scale, scale, scale);

                if (animProgress >= 1) {
                    state = 'EXPLODING';
                    animProgress = 0;
                }

            } else if (state === 'EXPLODING') {
                animProgress += 0.04;
                for (let i = 0; i < heartPointsCount; i++) {
                    pos[i * 3] += heartVelocities[i * 3] * 4;
                    pos[i * 3 + 1] += heartVelocities[i * 3 + 1] * 4;
                    pos[i * 3 + 2] += heartVelocities[i * 3 + 2] * 8;
                }
                heartGeo.attributes.position.needsUpdate = true;
                camera.position.z -= 0.8;

                if (animProgress >= 1) {
                    state = 'GALAXY';
                    document.getElementById('postBlastControls').classList.remove('hidden');
                }

            } else if (state === 'GALAXY') {
                galaxyDisk.rotation.y += 0.003;
                photoGroup.rotation.y += 0.004;

                galaxyMat.opacity = Math.min(0.85, galaxyMat.opacity + 0.02);
                photoMeshes.forEach(mesh => {
                    mesh.material.opacity = Math.min(1, mesh.material.opacity + 0.02);
                });
            }

            starPoints.rotation.y += 0.0005;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const letterModal = document.getElementById('letterModal');
        const typewriterBox = document.getElementById('typewriterBox');
        let typewriterTimer = null;

        function openTypewriter() {
            letterModal.classList.add('active');
            typewriterBox.textContent = '';
            const msg = window.GALAXY_DATA.loveMessage || "";

            let i = 0;
            if (typewriterTimer) clearInterval(typewriterTimer);

            typewriterTimer = setInterval(() => {
                if (i < msg.length) {
                    typewriterBox.textContent += msg.charAt(i);
                    i++;
                } else {
                    clearInterval(typewriterTimer);
                }
            }, 30);
        }

        function closeLetterAndAdvance() {
            letterModal.classList.remove('active');
            if (state === 'IDLE') {
                triggerBigBang();
            }
        }

        document.getElementById('openLetterBtn').addEventListener('click', openTypewriter);
        document.getElementById('closeModalBtn').addEventListener('click', () => {
            letterModal.classList.remove('active');
        });
        document.getElementById('closeLetterActionBtn').addEventListener('click', closeLetterAndAdvance);

        document.getElementById('sendLoveBtn').addEventListener('click', () => {
            closeLetterAndAdvance();
            confetti({
                particleCount: 160,
                spread: 100,
                origin: { y: 0.6 },
                colors: ["#ff7597", "#a855f7", "#38bdf8", "#fbbf24"]
            });
        });

        let audio = null;
        let isPlaying = false;
        const musicBtn = document.getElementById('musicBtn');

        function playMusic() {
            if (!audio) {
                audio = new Audio(window.GALAXY_DATA.audioUrl || "/demos/surprise/loveSong.mp3");
                audio.loop = true;
                audio.volume = 0.5;
            }
            if (!isPlaying) {
                audio.play().then(() => {
                    isPlaying = true;
                    musicBtn.textContent = "🔊 Music Playing";
                }).catch(() => {});
            }
        }

        musicBtn.addEventListener('click', () => {
            if (!audio) playMusic();
            else if (isPlaying) {
                audio.pause();
                isPlaying = false;
                musicBtn.textContent = "🎵 Play Music";
            } else {
                audio.play();
                isPlaying = true;
                musicBtn.textContent = "🔊 Music Playing";
            }
        });
    </script>
</body>
</html>
